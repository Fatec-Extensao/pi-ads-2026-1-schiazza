name: Publicar Desenvolvimento Web
on:
  push:
    branches: [main]
    paths: ['2026-2/desenvolvimento-web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Validar fontes e links
        run: |
          python3 2026-2/desenvolvimento-web/testes/validar.py
          node --check 2026-2/desenvolvimento-web/src/js/app.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: 2026-2/desenvolvimento-web/src
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
